name: Refresh AusClimate data

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run data pipeline
        run: python main.py

      - name: Commit refreshed data
        run: |
          git config user.name "ausclimate-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/processed
          git diff --staged --quiet || git commit -m "Scheduled data refresh"
          git pull --rebase origin main
          git push